name: Catalog Check

"on":
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generated-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python python/update_gallery_registry.py validate
      - run: python python/build_catalog.py --check

  upstream-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - run: pip install -r requirements.txt
      - run: python python/sync_hf_catalog.py --check-remote
      - run: python python/sync_sparrow_catalog.py --check-remote

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: generated-catalog
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build catalog
        run: python python/build_catalog.py
      - name: Prepare Pages site
        run: |
          mkdir -p site/gallery
          cp -r gallery/. site/gallery/
          cp -r assets site/gallery/assets
          cp docs/index.html site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
